site_name: "Compiler Dashboards: Documentation"
repo_url: https://github.com/compilerla/dashboards
edit_uri: edit/main/docs
site_url: https://docs.compiler.la/dashboards

theme:
  name: material
  features:
    - content.code.copy
    - navigation.expand
    - navigation.tabs
    - toc.integrate
  favicon: https://compiler.la/favicon.ico
  logo: https://avatars.githubusercontent.com/u/13874321?s=100&v=4
  palette:
    primary: green
    accent: deep purple

extra:
  analytics:
    provider: google
    property: G-VR1QBF67SK

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - codehilite:
      linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: !relative
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.smartsymbols
  - meta
  - toc:
      permalink: " ¶"
  - smarty

plugins:
  - awesome-pages
  - redirects:
      redirect_maps:
  - search

extra_css:
  - https://use.fontawesome.com/releases/v6.1.2/css/all.css
