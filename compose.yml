services:
  dev:
    build:
      context: "."
      dockerfile: ".devcontainer/Dockerfile"
    entrypoint: []
    command: "sleep infinity"
    image: "compilerla/dashboards:dev"
    volumes:
      - "./:/home/compiler/src"
    env_file:
      - ".env"
    environment:
      MB_DB_HOST: "postgres"
      MB_DB_PORT: "5432"
      MB_DB_USER: "metabase"
      MB_DB_DBNAME: "metabase"
      METABASE_URL: "http://metabase:3000"
    depends_on:
      postgres:
        condition: "service_healthy"
      metabase:
        condition: "service_started"
  docs:
    image: "compilerla/dashboards:dev"
    entrypoint: mkdocs
    command: serve --livereload --dev-addr "0.0.0.0:8001"
    ports:
      - "8001:8001"
    volumes:
      - "./:/home/compiler/src"
  metabase:
    image: "metabase/metabase:v0.65.2"
    container_name: "metabase"
    ports:
      - "3000:3000"
    env_file:
      - ".env"
    environment:
      MB_DB_TYPE: "postgres"
      MB_DB_DBNAME: "metabase"
      MB_DB_PORT: "5432"
      MB_DB_HOST: "postgres"
      MB_ADMIN_EMAIL: "${MB_ADMIN_EMAIL:-admin@localhost}"
      MB_ADMIN_PASSWORD: "${MB_ADMIN_PASSWORD:-admin}"
    depends_on:
      postgres:
        condition: "service_healthy"
    restart: "unless-stopped"
  postgres:
    image: "postgres:18-alpine"
    container_name: "postgres"
    environment:
      POSTGRES_DB: "metabase"
      POSTGRES_USER: "metabase"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-metabase}"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: "5s"
      timeout: "5s"
      retries: 5
    restart: "unless-stopped"

volumes:
  postgres_data:
    driver: local
