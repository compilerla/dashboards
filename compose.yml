services:
  dev:
    build:
      context: "."
      dockerfile: ".devcontainer/Dockerfile"
    entrypoint: []
    command: "sleep infinity"
    image: "compilerla/dashboards:dev"
    volumes:
      - "./:/home/compiler/src"
    env_file:
      - ".env"
    depends_on:
      postgres:
        condition: "service_healthy"
      metabase:
        condition: "service_started"
  docs:
    image: "compilerla/dashboards:dev"
    entrypoint: mkdocs
    command: serve --livereload --dev-addr "0.0.0.0:8001"
    ports:
      - "8001:8001"
    volumes:
      - "./:/home/compiler/src"
  metabase:
    build:
      context: "./metabase"
      dockerfile: "Dockerfile"
    container_name: "metabase"
    ports:
      - "3000:3000"
    env_file:
      - ".env"
    depends_on:
      postgres:
        condition: "service_healthy"
    restart: "unless-stopped"
  postgres:
    image: "postgres:18-alpine"
    container_name: "postgres"
    env_file:
      - ".env"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: "5s"
      timeout: "5s"
      retries: 5
    restart: "unless-stopped"

volumes:
  postgres_data:
    driver: local
