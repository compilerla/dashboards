services:
  dev:
    build:
      context: "."
      dockerfile: ".devcontainer/Dockerfile"
    entrypoint: []
    command: "sleep infinity"
    image: "compilerla/dashboards:dev"
    volumes:
      - "./:/home/compiler/src"
    environment:
      MB_DB_HOST: "postgres"
      MB_DB_PORT: "5432"
      MB_DB_USER: "metabase"
      MB_DB_DBNAME: "metabase"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-metabase_dev_password}"
      METABASE_URL: "http://metabase:3000"
    depends_on:
      postgres:
        condition: "service_healthy"
      metabase:
        condition: "service_started"

  metabase:
    image: "metabase/metabase:v0.65.x"
    container_name: "metabase"
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: "postgres"
      MB_DB_DBNAME: "metabase"
      MB_DB_PORT: "5432"
      MB_DB_USER: "metabase"
      MB_DB_PASS: "${POSTGRES_PASSWORD:-metabase}"
      MB_DB_HOST: "postgres"
      MB_ENCRYPTION_SECRET_KEY: "${MB_ENCRYPTION_SECRET_KEY:-local_dev_secret_key_32_characters_minimum_len}"
      JAVA_OPTS: "-Xmx1024m -Xms512m"
    depends_on:
      postgres:
        condition: "service_healthy"
    restart: "unless-stopped"

  postgres:
    image: "postgres:18-alpine"
    container_name: "postgres"
    environment:
      POSTGRES_DB: "metabase"
      POSTGRES_USER: "metabase"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-metabase}"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: "5s"
      timeout: "5s"
      retries: 5
    restart: "unless-stopped"

volumes:
  postgres_data:
