name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      # pre-release tag
      - "202[3-9].[0-9][0-9].[0-9]+-rc[0-9]+"
      # release tags
      - "202[3-9].[0-9][0-9].[0-9]+"

defaults:
  run:
    shell: bash
    working-directory: terraform

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      is_tag: ${{ steps.set-env.outputs.is_tag }}
      is_release: ${{ steps.set-env.outputs.is_release }}
    steps:
      - id: set-env
        run: |
          # 1. Determine if it's a tag
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            IS_TAG="true"
          else
            IS_TAG="false"
          fi
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT

          # 2. Determine environment name
          if [[ $IS_TAG == "false" ]]; then
            ENV="dev"
          elif [[ "${{ github.ref }}" == *"-rc"* ]]; then
            ENV="test"
          else
            ENV="prod"
          fi
          echo "env_name=$ENV" >> $GITHUB_OUTPUT

          # 3. Determine if it's a final release tag
          if [[ $ENV == "prod" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  terraform-apply:
    runs-on: ubuntu-latest
    needs: [setup]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache Parameters
        id: cache_params
        working-directory: .
        run: |
          CACHE_SCOPE="compiler"
          MAIN_BRANCH_REF="refs/heads/main"
          echo "cache_from_args=type=gha,scope=${CACHE_SCOPE},ref=${MAIN_BRANCH_REF}" >> $GITHUB_OUTPUT
          echo "cache_to_args=type=gha,scope=${CACHE_SCOPE},mode=max,ref=${MAIN_BRANCH_REF}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to GitHub Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          build-args: GIT-SHA=${{ github.sha }}
          cache-from: ${{ steps.cache_params.outputs.cache_from_args }}
          cache-to: ${{ steps.cache_params.outputs.cache_to_args }}
          context: .
          file: metabase/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/metabase:${{ github.sha }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6 # should match TF_VERSION in .devcontainer/Dockerfile

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: ./init.sh "${{ needs.setup.outputs.env_name }}"

      - name: Terraform Plan
        env:
          TF_VAR_metabase_container_image: ghcr.io/${{ github.repository }}/metabase:${{ github.sha }}
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Terraform Apply
        env:
          TF_VAR_metabase_container_image: ghcr.io/${{ github.repository }}/metabase:${{ github.sha }}
        run: terraform apply -lock-timeout=5m tfplan

      - name: Attach detailed summary to job
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3.2.0
        with:
          planfile: tfplan
          token: ${{ github.token }}
          skip-comment: true

  release:
    needs: [setup, terraform-apply]
    if: ${{ needs.setup.outputs.is_release =='true' }}
    runs-on: ubuntu-latest
    permissions:
      # https://github.com/softprops/action-gh-release#permissions
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          prerelease: false
          generate_release_notes: true
