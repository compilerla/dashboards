name: Health Check

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  id-token: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'prod' || '' }}
    env:
      CLOUD_RUN_SERVICE: metabase
      GCP_PROJECT: data-warehouse-492522
      GCP_REGION: us-west1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 446.0.0"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Get Cloud Run URL
        id: get-url
        run: |
          URL=$(gcloud run services describe $CLOUD_RUN_SERVICE --project=$GCP_PROJECT --region=$GCP_REGION --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Cloud Run URL: $URL"

      - name: Check health endpoint
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --fail "${{ steps.get-url.outputs.url }}/api/health")
          if [ "$STATUS" -eq 200 ]; then
            echo "Health check passed with status $STATUS"
          else
            echo "Health check failed with status $STATUS"
            exit 1
          fi
