name: Terraform Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - "metabase/**"

defaults:
  run:
    shell: bash
    working-directory: terraform

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest tagged image SHA
        id: latest-tag
        run: |
          SHA=$(curl -s "https://api.github.com/repos/compilerla/dashboards/tags?per_page=1" \
            | jq -r '.[0].commit.sha')
          if [[ -z "$SHA" ]]; then
            echo "No release tags found, aborting" >&2
            exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 446.0.0"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6 # should match TF_VERSION in .devcontainer/Dockerfile

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Initialize Terraform and select workspace
        run: ./init.sh prod

      - name: Terraform Plan
        env:
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_metabase_image_tag: ${{ steps.latest-tag.outputs.sha }}
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Setup tf-summarize
        uses: kishaningithub/setup-tf-summarize@1596bb06f9509eb36b71bc1b304407cc111059c0 # v3.0.0

      - name: Create tf-summarize markdown file
        run: tf-summarize -md tfplan >> tf-summary.md

      - name: Check for existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: CHANGE
          direction: last
        id: fc

      - name: Create or update PR comment with course-grained plan summary
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: "./terraform/tf-summary.md"
          edit-mode: replace
